[package]
name = "inorobot_simulation"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true

[dependencies]
regex-lite = "0.1"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
