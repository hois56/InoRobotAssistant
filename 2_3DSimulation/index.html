        data-locale-script="/Language/runtime/i18n.js?v=32e3e6ff3849"
        data-guide="/0_Home/tool-guide-embed.js?v=20261120-blue"></script>
    <script>
        (() => {
            const entry = document.getElementById('rust-simulator');
            const failure = document.getElementById('simulation-boot-failure');
            const retry = failure.querySelector('button');
            // Keep these messages available even when the language script cannot load.
            const messages = {
                ko: ['3D 시뮬레이션을 불러오지 못했습니다. 연결을 확인하고 다시 시도해 주세요.', '다시 시도'],
                en: ['Could not load the 3D simulation. Check your connection and try again.', 'Try again'],
                'zh-CN': ['无法加载 3D 仿真。请检查网络连接后重试。', '重试'],
                vi: ['Không thể tải mô phỏng 3D. Hãy kiểm tra kết nối và thử lại.', 'Thử lại'],
                tr: ['3D simülasyonu yüklenemedi. Bağlantınızı kontrol edip tekrar deneyin.', 'Tekrar dene'],
                ru: ['Не удалось загрузить 3D-симуляцию. Проверьте подключение и повторите попытку.', 'Повторить']
            };
            function storedLocale(storageName) {
                try { return window[storageName].getItem('inorobot.locale'); }
                catch { return null; }
            }
            function guideLocale(search) {
                if (search.get('embed') !== 'manual' || window.parent === window) return null;
                // The home guide may not have passed its locale to the iframe yet.
                try { return window.parent.InoRobotI18n?.locale; }
                catch { return null; }
            }
            function showFailure() {
                const search = new URLSearchParams(location.search);
                const locale = [
                    search.get('lang'),
                    guideLocale(search),
                    window.InoRobotI18n?.locale,
                    storedLocale('localStorage'),
                    storedLocale('sessionStorage'),
                    document.documentElement.lang
                ].find(value => Object.hasOwn(messages, value)) || 'ko';
                document.documentElement.lang = locale;
                const [message, label] = messages[locale];
                failure.querySelector('[role="alert"]').textContent = message;
                retry.textContent = label;
                document.body.classList.add('simulation-boot-failed');
                document.body.inert = false;
                failure.hidden = false;
                if (window === window.top) retry.focus();
            }
            entry.addEventListener('error', showFailure, { once: true });
            entry.addEventListener('simulation:boot-failed', showFailure, { once: true });
            // A fresh document makes the browser retry failed ES module fetches.
            retry.addEventListener('click', () => location.reload());
        })();
    </script>
