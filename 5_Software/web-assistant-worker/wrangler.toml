name = "inorobot-web-assistant"
main = "worker.mjs"
compatibility_date = "2026-11-27"
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "PUBLIC_KNOWLEDGE"
database_name = "ino-robot-manuals"
database_id = "556604a4-4562-48b1-8a0a-8ac3948b07d0"

[[durable_objects.bindings]]
name = "CHAT_BUDGET"
class_name = "ChatBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatBudget"]

[[ratelimits]]
name = "VISITOR_RATE"
namespace_id = "7419062"
simple = { limit = 6, period = 60 }

[vars]
LIVE_PUBLIC_LOOKUP = "1"

[assets]
directory = "./assets"
binding = "KNOWLEDGE_ASSETS"
run_worker_first = true
