name = "ino-robot-display-auth"
main = "worker.js"
compatibility_date = "2024-01-01"

# Required secret: set with `wrangler secret put DISPLAY_PASSWORD`.
# Never commit the password or a public R2 URL.

[vars]
ALLOWED_ORIGINS = "https://inovancerobot.com,https://www.inovancerobot.com"

[[r2_buckets]]
binding = "LOCKED_ASSETS"
bucket_name = "inorobot-locked-assets"

# Visitor counter storage:
# Create a Cloudflare KV namespace, then bind it as VISITOR_KV before deploy.
# Example:
#   wrangler kv namespace create VISITOR_KV
#   wrangler kv key put "visitor:total" "721" --binding VISITOR_KV
#
# Add the generated namespace id here if deploying with Wrangler:
# [[kv_namespaces]]
# binding = "VISITOR_KV"
# id = "replace-with-cloudflare-kv-namespace-id"
