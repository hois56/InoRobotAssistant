    <script>
        // Initialize Icons
        lucide.createIcons();

        // Optional: Add subtle mouse movement effect to cards
        document.addEventListener('mousemove', (e) => {
            const cards = document.querySelectorAll('.glass-card');
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Simple glow follow effect on hover inner
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            });
        });
        // Visitor Counter (CounterAPI)
        (function () {
            try {
                const visitedKey = 'inorobot_v3_visited';
                const today = new Date().toISOString().split('T')[0];
                const stored = localStorage.getItem(visitedKey);

                let endpoint = 'https://api.counterapi.dev/v1/inorobot_assistant/main/';
                if (stored !== today) {
                    endpoint = 'https://api.counterapi.dev/v1/inorobot_assistant/main/up';
                    localStorage.setItem(visitedKey, today);
                }

                fetch(endpoint)
                    .then(r => r.json())
                    .then(d => {
                        const el = document.getElementById('visit-count');
                        if (el && d.count) el.innerText = d.count;
                    }).catch(() => { });
            } catch (e) { }
        })();
    </script>
