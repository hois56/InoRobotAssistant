<body class="bg-[#0b0e14] text-slate-200 min-h-screen overflow-x-hidden">
    <div class="ambient-glow"></div>

    <!-- Header Section -->
    <header
        class="sticky top-0 w-full flex flex-row justify-between items-center bg-[rgba(15,19,28,0.9)] backdrop-blur-xl border-b border-white/[0.05] px-8 py-0 shrink-0 h-[72px] z-50">
        <div class="flex flex-row items-center gap-6">
            <a href="/" class="logo-link group" title="메인 페이지로">
                <img src="../1_RobotModelSelect/INOVANCE_Logo.png" alt="Inovance"
                    class="logo-img h-[60px] w-auto transition-transform group-hover:scale-105">
            </a>
            <div class="header-divider h-8 w-px bg-white/[0.1] mx-2"></div>
            <h1 class="text-xl font-bold font-outfit text-white tracking-tight" data-i18n-skip>Technical Manual Center</h1>
        </div>
        <div class="flex items-center gap-4">
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 md:p-12">
        <!-- Hero Search Section -->
        <section class="text-center mb-16 animate-fade-in-up" style="animation: fadeInUp 0.8s ease forwards;">
            <h2 class="text-4xl md:text-5xl font-extrabold font-outfit text-white mb-6 font-bold">도움이 필요하신가요?</h2>
            <p class="text-slate-400 text-lg max-w-2xl mx-auto mb-10 italic">필요한 매뉴얼을 검색하거나 모델별 카테고리를 선택하세요.</p>

            <div class="relative max-w-2xl mx-auto">
                <i data-lucide="search"
                    class="absolute left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500 font-bold"></i>
                <input type="text" id="manualSearch" placeholder="키워드(예: SCARA, 설치, 통신)를 입력하세요..."
                    class="w-full bg-slate-900/40 border border-white/10 rounded-2xl py-4 pl-14 pr-6 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 backdrop-blur-md transition-all text-white placeholder-slate-600">
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <!-- Sidebar Filters -->
            <aside class="lg:col-span-3 space-y-5">
                <div>
                    <h3
                        class="text-sm font-bold font-outfit text-white tracking-wider mb-2 flex items-center gap-2">
                        <i data-lucide="layers" class="w-4 h-4 text-emerald-500"></i> Hardware Manual
                    </h3>
                    <div class="space-y-1" id="typeFilters">
                        <button class="filter-btn active w-full text-left" data-type="all">All Model</button>
                        <button class="filter-btn w-full text-left" data-type="scara">SCARA Robots</button>
                        <button class="filter-btn w-full text-left" data-type="6axis">6-Axis Robots</button>
                        <button class="filter-btn w-full text-left" data-type="controller">Controllers</button>
                        <button class="filter-btn w-full text-left" data-type="expansion">Expansion Card</button>
                        <button class="filter-btn w-full text-left" data-type="safetyFunction">Safety Function</button>
                        <button class="filter-btn w-full text-left" data-type="selection">Selection Guide</button>
                    </div>
                </div>

                <div>
                    <h3
                        class="text-sm font-bold font-outfit text-white tracking-wider mb-2 flex items-center gap-2">
                        <i data-lucide="tag" class="w-4 h-4 text-emerald-500"></i> Software Manual
                    </h3>
                    <div class="space-y-1" id="catFilters">
                        <button class="filter-btn active w-full text-left" data-cat="all">All Category</button>
                        <button class="filter-btn w-full text-left" data-cat="lab">InoRobotLab</button>
                        <button class="filter-btn w-full text-left" data-cat="pendant">Pendant</button>
                        <button class="filter-btn w-full text-left" data-cat="comm">Communication</button>
                        <button class="filter-btn w-full text-left" data-cat="api">Instruction</button>
                    </div>
                </div>

                <div>
                    <h3
                        class="text-sm font-bold font-outfit text-white tracking-wider mb-2 flex items-center gap-2">
                        <i data-lucide="graduation-cap" class="w-4 h-4 text-emerald-500"></i> Training Manual
                    </h3>
                    <div class="space-y-1" id="eduFilters">
                        <button class="filter-btn active w-full text-left" data-cat="all">All Training Manual</button>
                        <button class="filter-btn w-full text-left" data-cat="entry">Beginner Level</button>
                        <button class="filter-btn w-full text-left" data-cat="basic">Basic Level</button>
                        <button class="filter-btn w-full text-left" data-cat="advanced">Application Level</button>
                        <button class="filter-btn w-full text-left" data-cat="display">For Display</button>
                    </div>
                </div>

                <div>
                    <h3
                        class="text-sm font-bold font-outfit text-white tracking-wider mb-2 flex items-center gap-2">
                        <i data-lucide="network" class="w-4 h-4 text-emerald-500"></i> Communication Profile
                    </h3>
                    <div class="space-y-1" id="profileFilters">
                        <button class="filter-btn w-full text-left" data-cat="commProfile">All Profile</button>
                        <button class="filter-btn w-full text-left" data-cat="profile-ethercat">EtherCAT</button>
                        <button class="filter-btn w-full text-left" data-cat="profile-profinet">PROFINET</button>
                        <button class="filter-btn w-full text-left" data-cat="profile-ethernetip">EtherNet/IP</button>
                    </div>
                </div>

                <div>
                    <h3
                        class="text-sm font-bold font-outfit text-white tracking-wider mb-2 flex items-center gap-2">
                        <i data-lucide="badge-check" class="w-4 h-4 text-emerald-500"></i> Certificate
                    </h3>
                    <div class="space-y-1" id="certFilters">
                        <button class="filter-btn w-full text-left" data-cat="cert-kc">KCs</button>
                        <div class="certificate-subfilters space-y-1 ml-3 pl-3 border-l border-white/10" id="kcsFilters">
                            <button class="filter-btn certificate-subfilter w-full text-left" data-cat="cert-kcs-6axis">6-Axis</button>
                            <button class="filter-btn certificate-subfilter w-full text-left" data-cat="cert-kcs-6axis-high">6-Axis High Protection</button>
                            <button class="filter-btn certificate-subfilter w-full text-left" data-cat="cert-kcs-6axis-ip67">6-Axis IP67 Option</button>
                            <button class="filter-btn certificate-subfilter w-full text-left" data-cat="cert-kcs-6axis-sol">6-Axis Sol/VV Option</button>
                            <button class="filter-btn certificate-subfilter w-full text-left" data-cat="cert-kcs-scara">SCARA</button>
                            <button class="filter-btn certificate-subfilter w-full text-left" data-cat="cert-kcs-scara-high">SCARA High Protection</button>
                        </div>
                        <button class="filter-btn w-full text-left" data-cat="cert-ce">CE</button>
                        <button class="filter-btn w-full text-left" data-cat="cert-csgsus">cSGSus</button>
                        <button class="filter-btn w-full text-left" data-cat="cert-clean">Clean</button>
                        <button class="filter-btn w-full text-left" data-cat="cert-fcc">FCC</button>
                        <button class="filter-btn w-full text-left" data-cat="cert-fs">Safety</button>
                        <button class="filter-btn w-full text-left" data-cat="cert-mtbf">MTBF</button>
                    </div>
                </div>
            </aside>

            <!-- Manual List -->
            <div class="lg:col-span-9">
                <div id="manualList" class="space-y-4">
                    <!-- Items populated by script -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer removed -->

    <style>
        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }

        .ambient-glow {
            position: fixed;
            bottom: 10%;
            right: 10%;
            width: 50vw;
            height: 50vh;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.05) 0%, rgba(15, 23, 42, 0) 70%);
            z-index: -1;
            filter: blur(100px);
            pointer-events: none;
        }

        .filter-btn {
            padding: 0.5rem 0.75rem;
            border-radius: 0.625rem;
            background: transparent;
            border: 1px solid transparent;
            font-size: 0.875rem;
            font-weight: 500;
            color: #94a3b8;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
        }

        .certificate-subfilters {
            margin-top: 0.25rem;
            margin-bottom: 0.25rem;
        }

        .filter-btn.certificate-subfilter {
            padding: 0.375rem 0.625rem;
            font-size: 0.75rem;
            color: #64748b;
        }

        .filter-btn:hover {
            background: rgba(30, 41, 59, 0.4);
            color: #fff;
        }

        .filter-btn.active {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #10b981;
            font-weight: 700;
        }

        .manual-item {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .manual-item:hover {
            background: rgba(30, 41, 59, 0.7);
            border-color: rgba(16, 185, 129, 0.4);
            transform: translateX(8px);
        }

        .download-btn {
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.2);
            color: #60a5fa;
            transition: all 0.2s;
        }

        .download-btn:hover {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .view-btn {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #34d399;
            transition: all 0.2s;
        }

        .view-btn:hover {
            background: #059669;
            color: #fff;
            border-color: #059669;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .locked-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
        }

        .locked-btn:hover {
            border-color: #f59e0b;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.05);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(2rem);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <script src="script.js?v=20260729-1"></script>
